# A ogni modifica: i controlli veloci su tutto (contenuti, prerequisiti, lenti, traduzioni), poi un Chrome gioca solo i
# livelli toccati dalla modifica (tools/da-provare.mjs): la zona nuova, i livelli della simulazione cambiata, il primo
# livello di ogni zona se cambiano i dati dei mondi. Se cambia il motore li gioca tutti. Le prove sono divise per lingua
# e per lente e girano in parallelo. A mano (Run workflow) e ogni lunedì notte: tutti i livelli.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

jobs:
  controlli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      livelli: ${{ steps.scelta.outputs.livelli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Controllo dei contenuti
        run: node tools/check-content.mjs
      - name: Controllo dei prerequisiti
        run: node tools/check-prereq.mjs
      - name: Controllo delle lenti
        run: node tools/check-lenti.mjs
      - name: Controllo delle traduzioni inglesi
        run: node tools/i18n-strings.mjs --check
      - name: Quali livelli giocare
        id: scelta
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          PRIMA: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = pull_request ]; then BASE="$BASE_PR"; elif [ "$EVENTO" = push ]; then BASE="$PRIMA"; else BASE=""; fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            LIVELLI=$(git diff --name-only "$BASE" HEAD | node tools/da-provare.mjs)
          else
            echo "niente con cui confrontare: tutti i livelli"
            LIVELLI=tutto
          fi
          echo "livelli da giocare: ${LIVELLI:-nessuno}"
          echo "livelli=$LIVELLI" >> "$GITHUB_OUTPUT"

  gioca:
    needs: controlli
    if: needs.controlli.outputs.livelli != ''
    name: gioca (${{ matrix.lingua }}, ${{ matrix.lente }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lingua: [it, en]
        lente: [e, s, c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installa Playwright e Chrome
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Gioca i livelli
        env:
          LINGUA: ${{ matrix.lingua }}
          LENTE: ${{ matrix.lente }}
          LIVELLI: ${{ needs.controlli.outputs.livelli }}
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          if [ "$LINGUA" = it ] && [ "$LENTE" = s ]; then node tests/tools.mjs http://localhost:8765; fi
          if [ "$LIVELLI" = tutto ]; then
            node tests/play-all.mjs http://localhost:8765 "$LENTE"
          else
            node tests/play-all.mjs http://localhost:8765 "$LENTE" "$LIVELLI"
          fi
