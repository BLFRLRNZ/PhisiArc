# A ogni push: controllo dei contenuti, dei prerequisiti e poi un Chrome che gioca tutti i livelli nelle tre lenti.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Controllo dei contenuti
        run: node tools/check-content.mjs
      - name: Controllo dei prerequisiti
        run: node tools/check-prereq.mjs
      - name: Installa Playwright e Chrome
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Gioca tutti i livelli
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/play-all.mjs http://localhost:8765
